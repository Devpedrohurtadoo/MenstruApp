name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No known vulnerabilities in deployed dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Service worker is stamped
        run: node scripts/stamp-sw.mjs && git diff --exit-code public/sw.js
      - run: npx eslint .
      - run: npx prettier --check .
      - run: npx tsc -p tsconfig.json
      - run: npx vitest run
      - name: Install Chromium for e2e
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (mobile Chromium)
        run: npx playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
